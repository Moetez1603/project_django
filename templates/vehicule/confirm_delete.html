<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Supprimer un véhicule</title>
    <style>
        * { box-sizing: border-box; }
        body {
            align-items: center;
            background: #f4f7fa;
            color: #263445;
            display: flex;
            font-family: Arial, sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            padding: 1rem;
        }
        main {
            background: #fff;
            border: 1px solid #d5dce3;
            border-radius: 10px;
            box-shadow: 0 4px 14px rgb(23 50 77 / 8%);
            max-width: 520px;
            overflow: hidden;
            width: 100%;
        }
        header { background: #17324d; color: #fff; padding: 1.5rem; }
        h1 { margin: 0; }
        section { padding: 1.5rem; }
        .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
        .button {
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            font: inherit;
            font-weight: 700;
            padding: 0.7rem 1rem;
            text-decoration: none;
        }
        .delete-button { background: #b42318; color: #fff; }
        .delete-button:hover { background: #8f1c13; }
        .cancel-button { background: #edf2f7; color: #17324d; }
    </style>
</head>
<body>
    <main>
        <header><h1>Supprimer ce véhicule ?</h1></header>
        <section>
            <p>Confirmer la suppression du véhicule {{ object.immatriculation }}.</p>
            {% if object.offres.exists %}
                <p>Attention : ses offres associées seront également supprimées.</p>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="actions">
                    <button class="button delete-button" type="submit">Supprimer</button>
                    <a class="button cancel-button" href="{% url 'vehicule_detail' object.pk %}">Annuler</a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
